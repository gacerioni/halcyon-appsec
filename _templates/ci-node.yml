name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (dependencies)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Semgrep (code)
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/gacerioni/halcyon-appsec/main/rules/halcyon-appsec.yml -o /tmp/halcyon-appsec.yml
          pipx run semgrep scan --config /tmp/halcyon-appsec.yml --config p/typescript --config p/secrets --severity ERROR --error --metrics=off .
